<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" fill="none" role="img" aria-label="Chaotic agency desk before OneTrack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a0c0a"/>
      <stop offset="42%" stop-color="#8f1f16"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="fog" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffb000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffcf6b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#fff1ec" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fff1ec" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#2a0604" flood-opacity="0.35"/>
    </filter>
    <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="14" r="1" fill="#fff" opacity="0.05"/>
      <circle cx="42" cy="38" r="1" fill="#000" opacity="0.06"/>
      <circle cx="78" cy="22" r="1" fill="#fff" opacity="0.04"/>
      <circle cx="96" cy="70" r="1" fill="#000" opacity="0.05"/>
      <circle cx="24" cy="88" r="1" fill="#fff" opacity="0.05"/>
      <circle cx="60" cy="104" r="1" fill="#000" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="960" height="720" fill="url(#bg)"/>
  <rect width="960" height="720" fill="url(#glow)"/>
  <rect width="960" height="720" fill="url(#fog)"/>
  <rect width="960" height="720" fill="url(#grain)"/>

  <!-- tangled threads -->
  <path d="M120 140 C260 80, 340 260, 520 180 C680 110, 740 280, 880 200" stroke="#ffcf6b" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="7 10"/>
  <path d="M80 420 C220 300, 360 520, 560 390 C720 290, 780 470, 900 410" stroke="#f2ecdf" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="5 9"/>
  <path d="M160 560 C300 480, 420 620, 620 540 C760 480, 820 600, 910 560" stroke="#ffb000" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 8"/>

  <!-- floating passport fragment -->
  <g transform="translate(690 96) rotate(12)" filter="url(#soft)">
    <rect width="150" height="100" rx="12" fill="#f2ecdf"/>
    <rect x="16" y="16" width="46" height="58" rx="6" fill="#0c2d79"/>
    <rect x="74" y="22" width="58" height="8" rx="4" fill="#121a2e" opacity="0.35"/>
    <rect x="74" y="38" width="44" height="6" rx="3" fill="#121a2e" opacity="0.2"/>
    <rect x="74" y="52" width="52" height="6" rx="3" fill="#121a2e" opacity="0.2"/>
    <circle cx="39" cy="40" r="12" fill="#ffcf6b" opacity="0.85"/>
  </g>

  <!-- chat bubble cluster -->
  <g transform="translate(118 150)" filter="url(#soft)">
    <path d="M0 24 C0 10, 12 0, 28 0 H210 C226 0, 238 10, 238 24 V78 C238 92, 226 102, 210 102 H70 L42 128 V102 H28 C12 102, 0 92, 0 78 Z" fill="#fff8f4"/>
    <circle cx="36" cy="42" r="10" fill="#25d366"/>
    <rect x="56" y="34" width="140" height="10" rx="5" fill="#121a2e" opacity="0.55"/>
    <rect x="56" y="52" width="96" height="8" rx="4" fill="#121a2e" opacity="0.22"/>
  </g>

  <g transform="translate(310 210) rotate(-6)" filter="url(#soft)">
    <path d="M0 20 C0 8, 10 0, 24 0 H176 C190 0, 200 8, 200 20 V64 C200 76, 190 84, 176 84 H54 L30 108 V84 H24 C10 84, 0 76, 0 64 Z" fill="#ffe1d8"/>
    <rect x="22" y="28" width="128" height="9" rx="4.5" fill="#8f1f16" opacity="0.7"/>
    <rect x="22" y="46" width="84" height="7" rx="3.5" fill="#8f1f16" opacity="0.28"/>
  </g>

  <!-- excel sheet -->
  <g transform="translate(470 300) rotate(8)" filter="url(#soft)">
    <rect width="250" height="180" rx="14" fill="#fbf8f1"/>
    <rect width="250" height="34" rx="14" fill="#0c2d79"/>
    <rect y="20" width="250" height="14" fill="#0c2d79"/>
    <rect x="18" y="12" width="90" height="10" rx="5" fill="#ffb000"/>
    <g opacity="0.55">
      <rect x="18" y="54" width="214" height="12" rx="3" fill="#121a2e" opacity="0.12"/>
      <rect x="18" y="78" width="214" height="12" rx="3" fill="#121a2e" opacity="0.08"/>
      <rect x="18" y="102" width="214" height="12" rx="3" fill="#121a2e" opacity="0.12"/>
      <rect x="18" y="126" width="214" height="12" rx="3" fill="#121a2e" opacity="0.08"/>
      <rect x="18" y="150" width="120" height="12" rx="3" fill="#c2410c" opacity="0.35"/>
    </g>
    <rect x="160" y="146" width="72" height="22" rx="11" fill="#ffe1d8"/>
    <rect x="174" y="154" width="44" height="6" rx="3" fill="#b42318"/>
  </g>

  <!-- missed call badge -->
  <g transform="translate(150 470)" filter="url(#soft)">
    <rect width="210" height="64" rx="32" fill="#1a0706" fill-opacity="0.45"/>
    <circle cx="40" cy="32" r="18" fill="#ffb000"/>
    <path d="M33 27 C36 22, 45 22, 48 28 C46 36, 42 40, 36 42 C31 38, 30 32, 33 27 Z" fill="#8f1f16"/>
    <rect x="72" y="20" width="108" height="10" rx="5" fill="#f2ecdf" opacity="0.9"/>
    <rect x="72" y="38" width="72" height="8" rx="4" fill="#f2ecdf" opacity="0.4"/>
  </g>

  <!-- paper plane made from a sticky note -->
  <g transform="translate(760 470) rotate(-18)" filter="url(#soft)">
    <path d="M0 40 L150 0 L110 70 L86 52 L54 92 Z" fill="#ffcf6b"/>
    <path d="M150 0 L110 70 L86 52 Z" fill="#ffb000"/>
    <path d="M0 40 L54 92 L86 52 Z" fill="#ffe8a8"/>
  </g>

  <!-- faint stamp marks -->
  <circle cx="820" cy="250" r="46" stroke="#f2ecdf" stroke-opacity="0.18" stroke-width="3" stroke-dasharray="4 6"/>
  <circle cx="820" cy="250" r="28" stroke="#f2ecdf" stroke-opacity="0.12" stroke-width="2"/>
</svg>
